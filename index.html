<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Lake - AR Character Archive</title>


    <!-- ========================================= -->
    <!-- STYLE -->
    <!-- ========================================= -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

        }


        #startButton {

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 32px;

            font-size: 20px;
            font-weight: bold;

            border: none;

            border-radius: 12px;

            background: #111111;

            color: white;

            cursor: pointer;

        }


        #startButton:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        #status {

            position: fixed;

            z-index: 9999;

            left: 10px;
            right: 10px;
            bottom: 10px;

            padding: 12px;

            background: rgba(0, 0, 0, 0.8);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            border-radius: 8px;

            text-align: center;

        }


        #debug {

            position: fixed;

            z-index: 9998;

            top: 10px;
            left: 10px;
            right: 10px;

            max-height: 180px;

            overflow-y: auto;

            padding: 10px;

            background: rgba(0, 0, 0, 0.8);

            color: #00ff88;

            font-family: monospace;

            font-size: 12px;

            border-radius: 8px;

            display: none;

        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- START BUTTON -->
    <!-- ========================================= -->

    <button
        id="startButton"
        disabled
    >
        LOADING...
    </button>


    <!-- ========================================= -->
    <!-- STATUS -->
    <!-- ========================================= -->

    <div id="status">
        Starting A-Frame...
    </div>


    <!-- ========================================= -->
    <!-- DEBUG -->
    <!-- ========================================= -->

    <div id="debug"></div>


    <!-- ========================================= -->
    <!-- AR SCENE WILL BE CREATED BY JAVASCRIPT -->
    <!-- ========================================= -->


    <!-- ========================================= -->
    <!-- LOAD A-FRAME FIRST -->
    <!-- ========================================= -->

    <script>

        const status =
            document.querySelector("#status");

        const startButton =
            document.querySelector("#startButton");

        const debug =
            document.querySelector("#debug");


        function log(message) {

            console.log(message);

            debug.innerHTML +=
                message + "<br>";

        }


        function setStatus(message) {

            status.innerText =
                message;

        }


        // =========================================
        // LOAD A-FRAME
        // =========================================

        const aframeScript =
            document.createElement("script");

        aframeScript.src =
            "https://aframe.io/releases/1.5.0/aframe.min.js";


        aframeScript.onload =
            function () {

                log("✅ A-Frame script loaded.");

                setStatus(
                    "A-Frame loaded. Loading MindAR..."
                );


                loadMindAR();

            };


        aframeScript.onerror =
            function () {

                log(
                    "❌ A-Frame script FAILED to load."
                );

                setStatus(
                    "❌ A-Frame failed to load."
                );

            };


        document.head.appendChild(
            aframeScript
        );



        // =========================================
        // LOAD MINDAR AFTER A-FRAME
        // =========================================

        function loadMindAR() {

            const mindarScript =
                document.createElement("script");


            mindarScript.src =
                "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js";


            mindarScript.onload =
                function () {

                    log(
                        "✅ MindAR script loaded."
                    );


                    setStatus(
                        "MindAR script loaded. Creating AR scene..."
                    );


                    waitForMindAR();

                };


            mindarScript.onerror =
                function () {

                    log(
                        "❌ MindAR script FAILED to load."
                    );


                    setStatus(
                        "❌ MindAR script failed to load."
                    );

                };


            document.head.appendChild(
                mindarScript
            );

        }



        // =========================================
        // WAIT FOR MINDAR COMPONENT
        // =========================================

        function waitForMindAR() {

            let attempts = 0;


            const checker =
                setInterval(
                    function () {

                        attempts++;


                        log(
                            "Checking MindAR component... " +
                            attempts
                        );


                        if (
                            window.AFRAME &&
                            AFRAME.components &&
                            AFRAME.components[
                                "mindar-image"
                            ]
                        ) {

                            clearInterval(
                                checker
                            );


                            log(
                                "✅ MindAR component registered."
                            );


                            setStatus(
                                "✅ MindAR loaded. Creating AR system..."
                            );


                            createARScene();

                            return;

                        }


                        if (attempts >= 30) {

                            clearInterval(
                                checker
                            );


                            log(
                                "❌ MindAR component was not registered."
                            );


                            setStatus(
                                "❌ MindAR component failed."
                            );

                        }

                    },
                    500
                );

        }



        // =========================================
        // CREATE AR SCENE
        // =========================================

        function createARScene() {

            log(
                "Creating A-Frame AR scene..."
            );


            const scene =
                document.createElement(
                    "a-scene"
                );


            scene.setAttribute(
                "id",
                "arScene"
            );


            scene.setAttribute(
                "mindar-image",
                `
                imageTargetSrc: ./targets.mind;
                autoStart: false;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
                `
            );


            scene.setAttribute(
                "embedded",
                ""
            );


            scene.setAttribute(
                "color-space",
                "sRGB"
            );


            scene.setAttribute(
                "renderer",
                "colorManagement: true; physicallyCorrectLights"
            );


            scene.setAttribute(
                "vr-mode-ui",
                "enabled: false"
            );


            scene.setAttribute(
                "device-orientation-permission-ui",
                "enabled: false"
            );


            // =====================================
            // VIDEO
            // =====================================

            const video =
                document.createElement(
                    "video"
                );


            video.id =
                "taehyunVideo";


            video.src =
                "./videos/TaeHyun.mp4";


            video.preload =
                "metadata";


            video.loop =
                true;


            video.playsInline =
                true;


            video.setAttribute(
                "webkit-playsinline",
                ""
            );


            video.muted =
                true;


            video.style.display =
                "none";


            scene.appendChild(
                video
            );


            // =====================================
            // CAMERA
            // =====================================

            const camera =
                document.createElement(
                    "a-camera"
                );


            camera.setAttribute(
                "position",
                "0 0 0"
            );


            camera.setAttribute(
                "look-controls",
                "enabled: false"
            );


            scene.appendChild(
                camera
            );


            // =====================================
            // TAEHYUN TARGET
            // =====================================

            const target =
                document.createElement(
                    "a-entity"
                );


            target.id =
                "taehyunTarget";


            target.setAttribute(
                "mindar-image-target",
                "targetIndex: 0"
            );


            // =====================================
            // VIDEO PLANE
            // =====================================

            const videoPlane =
                document.createElement(
                    "a-video"
                );


            videoPlane.id =
                "taehyunVideoPlane";


            videoPlane.setAttribute(
                "src",
                "#taehyunVideo"
            );


            videoPlane.setAttribute(
                "position",
                "0 0 0.01"
            );


            videoPlane.setAttribute(
                "rotation",
                "0 0 0"
            );


            videoPlane.setAttribute(
                "width",
                "1"
            );


            videoPlane.setAttribute(
                "height",
                "1.777"
            );


            target.appendChild(
                videoPlane
            );


            scene.appendChild(
                target
            );


            document.body.appendChild(
                scene
            );


            log(
                "✅ AR scene created."
            );


            setStatus(
                "Initializing MindAR system..."
            );


            scene.addEventListener(
                "loaded",
                function () {

                    log(
                        "✅ A-Frame scene loaded."
                    );


                    initializeAR(
                        scene,
                        target,
                        video
                    );

                }
            );

        }



        // =========================================
        // INITIALIZE AR
        // =========================================

        function initializeAR(
            scene,
            target,
            video
        ) {

            let attempts = 0;


            const checker =
                setInterval(
                    function () {

                        attempts++;


                        const arSystem =
                            scene.systems[
                                "mindar-image-system"
                            ];


                        if (arSystem) {

                            clearInterval(
                                checker
                            );


                            log(
                                "================================="
                            );


                            log(
                                "✅ MINDAR SYSTEM FOUND!"
                            );


                            log(
                                "================================="
                            );


                            setStatus(
                                "✅ MindAR loaded. Ready!"
                            );


                            startButton.disabled =
                                false;


                            startButton.innerText =
                                "START AR";


                            setupAR(
                                scene,
                                arSystem,
                                target,
                                video
                            );


                            return;

                        }


                        log(
                            "Waiting for MindAR system... " +
                            attempts
                        );


                        if (attempts >= 30) {

                            clearInterval(
                                checker
                            );


                            log(
                                "❌ MindAR system not found."
                            );


                            setStatus(
                                "❌ MindAR system failed."
                            );

                        }

                    },
                    500
                );

        }



        // =========================================
        // SETUP AR EVENTS
        // =========================================

        function setupAR(
            scene,
            arSystem,
            target,
            video
        ) {


            // =====================================
            // START AR
            // =====================================

            startButton.addEventListener(
                "click",
                function () {

                    log(
                        "START AR clicked."
                    );


                    startButton.style.display =
                        "none";


                    setStatus(
                        "📷 Starting camera..."
                    );


                    try {

                        arSystem.start();

                    }

                    catch (error) {

                        console.error(
                            error
                        );


                        log(
                            "❌ AR start error: " +
                            error.message
                        );


                        setStatus(
                            "❌ AR could not start."
                        );


                        startButton.style.display =
                            "block";

                    }

                }
            );



            // =====================================
            // AR READY
            // =====================================

            scene.addEventListener(
                "arReady",
                function () {

                    log(
                        "✅ CAMERA READY."
                    );


                    setStatus(
                        "✅ Camera ready! Point at TaeHyun's card."
                    );

                }
            );



            // =====================================
            // AR ERROR
            // =====================================

            scene.addEventListener(
                "arError",
                function (event) {

                    console.error(
                        event
                    );


                    log(
                        "❌ MINDAR CAMERA ERROR."
                    );


                    setStatus(
                        "❌ MindAR camera error."
                    );


                    startButton.style.display =
                        "block";


                    startButton.disabled =
                        false;


                    startButton.innerText =
                        "START AR";

                }
            );



            // =====================================
            // TARGET FOUND
            // =====================================

            target.addEventListener(
                "targetFound",
                function () {

                    log(
                        "🎬 TAEHYUN CARD FOUND!"
                    );


                    setStatus(
                        "🎬 TaeHyun found!"
                    );


                    video.currentTime =
                        0;


                    video.play()

                        .then(
                            function () {

                                log(
                                    "✅ TaeHyun video playing!"
                                );

                            }
                        )

                        .catch(
                            function (error) {

                                log(
                                    "❌ Video playback failed."
                                );


                                console.error(
                                    error
                                );

                            }
                        );

                }
            );



            // =====================================
            // TARGET LOST
            // =====================================

            target.addEventListener(
                "targetLost",
                function () {

                    log(
                        "TaeHyun card lost."
                    );


                    setStatus(
                        "🔍 Looking for TaeHyun card..."
                    );


                    video.pause();

                }
            );

        }

    </script>


</body>

</html>
