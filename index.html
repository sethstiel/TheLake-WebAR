<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>The Lake - AR Character Archive</title>


    <!-- ========================= -->
    <!-- A-FRAME -->
    <!-- ========================= -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- ========================= -->
    <!-- MINDAR -->
    <!-- ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- ========================= -->
    <!-- PAGE STYLE -->
    <!-- ========================= -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        /* START AR BUTTON */

        #startButton {

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 32px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #111111;
            color: white;

            cursor: pointer;
        }


        #startButton:disabled {

            opacity: 0.6;
        }


        /* LOADING MESSAGE */

        #loadingMessage {

            display: none;

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 10%;

            transform: translateX(-50%);

            padding: 12px 20px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            border-radius: 10px;

            font-size: 16px;

            text-align: center;
        }


    </style>

</head>


<body>


    <!-- ========================= -->
    <!-- START BUTTON -->
    <!-- ========================= -->

    <button id="startButton">
        START AR
    </button>


    <!-- ========================= -->
    <!-- LOADING MESSAGE -->
    <!-- ========================= -->

    <div id="loadingMessage">
        Starting AR...
    </div>


    <!-- ========================= -->
    <!-- AR SCENE -->
    <!-- ========================= -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >


        <!-- ========================= -->
        <!-- ASSETS -->
        <!-- ========================= -->

        <a-assets>

            <!-- TaeHyun AI animation -->
            <video

                id="taehyunVideo"

                src="./videos/TaeHyun.mp4"

                preload="auto"

                loop

                playsinline

                webkit-playsinline

                muted
            >
            </video>

        </a-assets>


        <!-- ========================= -->
        <!-- CAMERA -->
        <!-- ========================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"
        >
        </a-camera>


        <!-- ========================= -->
        <!-- TAEHYUN IMAGE TARGET -->
        <!-- ========================= -->

        <!--
            targetIndex: 0

            Your MindAR compiler order was:

            0 = TaeHyun
            1 = Wendy
            2 = JB
            3 = Han
        -->

        <a-entity

            id="taehyunTarget"

            mindar-image-target="targetIndex: 0"
        >


            <!-- ========================= -->
            <!-- TAEHYUN VIDEO -->
            <!-- ========================= -->

            <a-video

                id="taehyunVideoPlane"

                src="#taehyunVideo"

                position="0 0 0.01"

                rotation="0 0 0"

                width="1"

                height="1.777"
            >
            </a-video>


        </a-entity>


    </a-scene>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script>

        document.addEventListener("DOMContentLoaded", () => {


            // ---------------------------------
            // GET HTML ELEMENTS
            // ---------------------------------

            const scene =
                document.querySelector("#arScene");


            const startButton =
                document.querySelector("#startButton");


            const loadingMessage =
                document.querySelector("#loadingMessage");


            const taehyunTarget =
                document.querySelector("#taehyunTarget");


            const taehyunVideo =
                document.querySelector("#taehyunVideo");


            // ---------------------------------
            // GET MINDAR SYSTEM
            // ---------------------------------

            const arSystem =
                scene.systems["mindar-image-system"];


            // ---------------------------------
            // CHECK MINDAR
            // ---------------------------------

            if (!arSystem) {

                console.error(
                    "MindAR system was not found."
                );

                alert(
                    "MindAR could not start.\n\n" +
                    "Please check that the MindAR script loaded correctly."
                );

                return;
            }


            // ---------------------------------
            // START AR BUTTON
            // ---------------------------------

            startButton.addEventListener(
                "click",
                () => {

                    console.log(
                        "START AR clicked."
                    );


                    // Disable button
                    startButton.disabled = true;


                    // Change button text
                    startButton.textContent =
                        "STARTING AR...";


                    // Show loading message
                    loadingMessage.style.display =
                        "block";


                    try {

                        // Start MindAR
                        arSystem.start();

                        console.log(
                            "MindAR start requested."
                        );

                    }

                    catch (error) {

                        console.error(
                            "MindAR start error:",
                            error
                        );


                        startButton.disabled = false;

                        startButton.textContent =
                            "START AR";


                        loadingMessage.style.display =
                            "none";


                        alert(
                            "AR could not start.\n\n" +
                            error.message
                        );

                    }

                }
            );


            // ---------------------------------
            // AR READY
            // ---------------------------------

            scene.addEventListener(
                "arReady",
                () => {

                    console.log(
                        "AR is ready!"
                    );


                    startButton.style.display =
                        "none";


                    loadingMessage.style.display =
                        "none";

                }
            );


            // ---------------------------------
            // AR ERROR
            // ---------------------------------

            scene.addEventListener(
                "arError",
                (event) => {

                    console.error(
                        "MindAR AR error:",
                        event
                    );


                    startButton.style.display =
                        "block";


                    startButton.disabled =
                        false;


                    startButton.textContent =
                        "START AR";


                    loadingMessage.style.display =
                        "none";


                    alert(
                        "MindAR could not start.\n\n" +
                        "Please check your browser and camera permission."
                    );

                }
            );


            // ---------------------------------
            // TAEHYUN CARD FOUND
            // ---------------------------------

            taehyunTarget.addEventListener(
                "targetFound",
                () => {

                    console.log(
                        "TAEHYUN CARD FOUND!"
                    );


                    // Start the video from the beginning
                    taehyunVideo.currentTime = 0;


                    // Play animation
                    taehyunVideo.play()
                        .then(() => {

                            console.log(
                                "TaeHyun animation is playing!"
                            );

                        })
                        .catch((error) => {

                            console.error(
                                "TaeHyun video could not play:",
                                error
                            );

                        });

                }
            );


            // ---------------------------------
            // TAEHYUN CARD LOST
            // ---------------------------------

            taehyunTarget.addEventListener(
                "targetLost",
                () => {

                    console.log(
                        "TAEHYUN CARD LOST!"
                    );


                    // Pause animation
                    taehyunVideo.pause();

                }
            );


        });

    </script>


</body>

</html>
