<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Lake - AR Character Archive</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #startButton {
            position: fixed;
            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 32px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #111;
            color: white;

            cursor: pointer;
        }

        #startButton:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #status {
            position: fixed;
            z-index: 9999;

            left: 10px;
            right: 10px;
            bottom: 10px;

            padding: 12px;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 14px;

            border-radius: 8px;

            text-align: center;
        }

        #debug {
            position: fixed;
            z-index: 9998;

            top: 10px;
            left: 10px;
            right: 10px;

            max-height: 220px;

            overflow-y: auto;

            padding: 10px;

            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;

            font-family: monospace;
            font-size: 12px;

            border-radius: 8px;
        }

        /*
            Keep the video technically visible to the browser
            instead of using display:none.

            This helps A-Frame create the video texture correctly.
        */
        #taehyunVideo {
            position: fixed;

            width: 1px;
            height: 1px;

            left: -10px;
            top: -10px;

            opacity: 0;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- START BUTTON -->
    <button id="startButton" disabled>
        LOADING...
    </button>

    <!-- STATUS -->
    <div id="status">
        Loading AR scene...
    </div>

    <!-- DEBUG LOG -->
    <div id="debug">
        Starting...
    </div>


    <!--
        ==========================================
        AR SCENE
        ==========================================
    -->

    <a-scene
        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >

        <!--
            ======================================
            VIDEO
            ======================================
        -->

        <a-assets>

            <video
                id="taehyunVideo"

                src="./videos/Taehyun.mp4"

                preload="auto"

                loop

                playsinline
                webkit-playsinline

                muted

                crossorigin="anonymous"
            ></video>

        </a-assets>


        <!--
            ======================================
            CAMERA
            ======================================
        -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!--
            ======================================
            TAEHYUN IMAGE TARGET
            targetIndex 0 = TaeHyun
            ======================================
        -->

        <a-entity
            id="taehyunTarget"

            mindar-image-target="
                targetIndex: 0;
            "
        >

            <a-video
                id="taehyunVideoPlane"

                src="#taehyunVideo"

                position="0 0 0.01"

                width="1"
                height="1.777"

            ></a-video>

        </a-entity>

    </a-scene>


    <!--
        ==========================================
        JAVASCRIPT
        ==========================================
    -->

    <script>

        /*
            ======================================
            ELEMENT REFERENCES
            ======================================
        */

        const scene =
            document.querySelector("#arScene");

        const startButton =
            document.querySelector("#startButton");

        const status =
            document.querySelector("#status");

        const debug =
            document.querySelector("#debug");

        const target =
            document.querySelector("#taehyunTarget");

        const video =
            document.querySelector("#taehyunVideo");


        /*
            ======================================
            DEBUG FUNCTION
            ======================================
        */

        function debugMessage(message) {

            console.log(message);

            debug.innerHTML +=
                "<br>" + message;

            debug.scrollTop =
                debug.scrollHeight;
        }


        /*
            ======================================
            VIDEO ERROR INFORMATION
            ======================================
        */

        function getVideoErrorMessage() {

            if (!video.error) {
                return "No browser video error information.";
            }

            switch (video.error.code) {

                case 1:
                    return "MEDIA_ERR_ABORTED";

                case 2:
                    return "MEDIA_ERR_NETWORK";

                case 3:
                    return "MEDIA_ERR_DECODE";

                case 4:
                    return "MEDIA_ERR_SRC_NOT_SUPPORTED";

                default:
                    return "Unknown video error.";
            }
        }


        /*
            ======================================
            VIDEO EVENTS
            ======================================
        */

        video.addEventListener(
            "loadedmetadata",
            function () {

                debugMessage(
                    "🎥 Video metadata loaded."
                );

                debugMessage(
                    "Video size: " +
                    video.videoWidth +
                    " x " +
                    video.videoHeight
                );
            }
        );


        video.addEventListener(
            "canplay",
            function () {

                debugMessage(
                    "✅ Video can play."
                );
            }
        );


        video.addEventListener(
            "loadeddata",
            function () {

                debugMessage(
                    "✅ Video data loaded."
                );
            }
        );


        video.addEventListener(
            "error",
            function () {

                debugMessage(
                    "❌ VIDEO ERROR: " +
                    getVideoErrorMessage()
                );

                console.error(
                    "Video error:",
                    video.error
                );
            }
        );


        /*
            ======================================
            A-FRAME LOADED
            ======================================
        */

        scene.addEventListener(
            "loaded",
            function () {

                debugMessage(
                    "✅ A-Frame scene loaded."
                );

                status.innerText =
                    "A-Frame ready. Checking MindAR...";

                checkMindAR();
            }
        );


        /*
            ======================================
            CHECK MINDAR
            ======================================
        */

        function checkMindAR() {

            let attempts = 0;

            const timer =
                setInterval(
                    function () {

                        attempts++;

                        debugMessage(
                            "Checking MindAR system... " +
                            attempts
                        );

                        const arSystem =
                            scene.systems[
                                "mindar-image-system"
                            ];


                        /*
                            MINDAR FOUND
                        */

                        if (arSystem) {

                            clearInterval(timer);

                            debugMessage(
                                "================================"
                            );

                            debugMessage(
                                "✅ MINDAR SYSTEM FOUND!"
                            );

                            debugMessage(
                                "================================"
                            );

                            status.innerText =
                                "✅ MindAR loaded. Ready!";

                            startButton.disabled =
                                false;

                            startButton.innerText =
                                "START AR";

                            setupAR(arSystem);
                        }


                        /*
                            MINDAR FAILED
                        */

                        if (attempts >= 20) {

                            clearInterval(timer);

                            debugMessage(
                                "================================"
                            );

                            debugMessage(
                                "❌ MindAR system was NOT created."
                            );

                            debugMessage(
                                "================================"
                            );

                            status.innerText =
                                "❌ MindAR system failed.";
                        }

                    },
                    500
                );
        }


        /*
            ======================================
            SETUP AR
            ======================================
        */

        function setupAR(arSystem) {


            /*
                ==================================
                START AR BUTTON
                ==================================
            */

            startButton.addEventListener(
                "click",
                function () {

                    debugMessage(
                        "START AR clicked."
                    );

                    startButton.style.display =
                        "none";

                    status.innerText =
                        "📷 Starting webcam...";


                    /*
                        Make sure browser knows
                        the video is muted.
                    */

                    video.muted = true;

                    video.defaultMuted = true;

                    video.setAttribute(
                        "muted",
                        ""
                    );

                    video.setAttribute(
                        "playsinline",
                        ""
                    );

                    video.setAttribute(
                        "webkit-playsinline",
                        ""
                    );


                    /*
                        Load video.
                    */

                    try {

                        video.load();

                        debugMessage(
                            "🎥 Loading TaeHyun video..."
                        );

                    } catch (error) {

                        debugMessage(
                            "❌ Video load error: " +
                            error.message
                        );
                    }


                    /*
                        Start MindAR.
                    */

                    try {

                        arSystem.start();

                    } catch (error) {

                        console.error(error);

                        debugMessage(
                            "❌ Start error: " +
                            error.message
                        );

                        status.innerText =
                            "❌ AR failed to start.";

                        startButton.style.display =
                            "block";
                    }

                }
            );


            /*
                ==================================
                AR READY
                ==================================
            */

            scene.addEventListener(
                "arReady",
                function () {

                    debugMessage(
                        "✅ WEBCAM READY."
                    );

                    status.innerText =
                        "✅ Webcam ready! Point at TaeHyun's card.";
                }
            );


            /*
                ==================================
                AR ERROR
                ==================================
            */

            scene.addEventListener(
                "arError",
                function (event) {

                    debugMessage(
                        "❌ MindAR camera error."
                    );

                    console.error(event);

                    status.innerText =
                        "❌ MindAR camera error.";

                    startButton.style.display =
                        "block";

                    startButton.disabled =
                        false;

                    startButton.innerText =
                        "START AR";
                }
            );


            /*
                ==================================
                TAEHYUN CARD FOUND
                ==================================
            */

            target.addEventListener(
                "targetFound",
                function () {

                    debugMessage(
                        "🎬 TAEHYUN CARD FOUND!"
                    );

                    status.innerText =
                        "🎬 TaeHyun found!";


                    /*
                        Reset video.
                    */

                    try {

                        video.currentTime = 0;

                    } catch (error) {

                        debugMessage(
                            "⚠️ Could not reset video time."
                        );
                    }


                    /*
                        Make absolutely sure
                        autoplay restrictions
                        don't block the video.
                    */

                    video.muted = true;

                    video.playsInline = true;


                    /*
                        Play video.
                    */

                    const playPromise =
                        video.play();


                    if (
                        playPromise !== undefined
                    ) {

                        playPromise
                            .then(
                                function () {

                                    debugMessage(
                                        "================================"
                                    );

                                    debugMessage(
                                        "✅ TAEHYUN VIDEO PLAYING!"
                                    );

                                    debugMessage(
                                        "================================"
                                    );

                                    status.innerText =
                                        "🎬 TaeHyun animation playing!";
                                }
                            )
                            .catch(
                                function (error) {

                                    debugMessage(
                                        "================================"
                                    );

                                    debugMessage(
                                        "❌ VIDEO PLAYBACK FAILED"
                                    );

                                    debugMessage(
                                        "Reason: " +
                                        error.message
                                    );

                                    debugMessage(
                                        "ReadyState: " +
                                        video.readyState
                                    );

                                    debugMessage(
                                        "NetworkState: " +
                                        video.networkState
                                    );

                                    debugMessage(
                                        "Video error: " +
                                        getVideoErrorMessage()
                                    );

                                    debugMessage(
                                        "================================"
                                    );

                                    console.error(
                                        "Video playback failed:",
                                        error
                                    );

                                    status.innerText =
                                        "❌ Video could not play. Check debug log.";
                                }
                            );
                    }

                }
            );


            /*
                ==================================
                TAEHYUN CARD LOST
                ==================================
            */

            target.addEventListener(
                "targetLost",
                function () {

                    debugMessage(
                        "TaeHyun card lost."
                    );

                    status.innerText =
                        "🔍 Looking for TaeHyun card...";

                    video.pause();
                }
            );

        }

    </script>

</body>
</html>
