<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Lake - AR Character Archive</title>


    <!-- ========================================= -->
    <!-- A-FRAME -->
    <!-- ========================================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- ========================================= -->
    <!-- MINDAR IMAGE TRACKING -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- ========================================= -->
    <!-- PAGE STYLE -->
    <!-- ========================================= -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;

        }


        /* START AR BUTTON */

        #startButton {

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 32px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #111111;

            color: white;

            cursor: pointer;

        }


        #startButton:disabled {

            opacity: 0.6;

            cursor: wait;

        }


        /* STATUS MESSAGE */

        #status {

            position: fixed;

            z-index: 9999;

            left: 10px;
            right: 10px;
            bottom: 10px;

            padding: 10px;

            background: rgba(0, 0, 0, 0.75);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            border-radius: 8px;

            text-align: center;

        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- START AR BUTTON -->
    <!-- ========================================= -->

    <button id="startButton" disabled>
        LOADING...
    </button>


    <!-- ========================================= -->
    <!-- STATUS -->
    <!-- ========================================= -->

    <div id="status">
        Loading AR system...
    </div>


    <!-- ========================================= -->
    <!-- AR SCENE -->
    <!-- ========================================= -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"

    >


        <!-- ========================================= -->
        <!-- ASSETS -->
        <!-- ========================================= -->

        <a-assets>

            <video

                id="taehyunVideo"

                src="./videos/TaeHyun.mp4"

                preload="auto"

                loop

                playsinline

                webkit-playsinline

                muted

            >
            </video>

        </a-assets>


        <!-- ========================================= -->
        <!-- CAMERA -->
        <!-- ========================================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        >
        </a-camera>


        <!-- ========================================= -->
        <!-- TAEHYUN IMAGE TARGET -->
        <!-- ========================================= -->

        <!--

            MindAR target order:

            Image 1 = TaeHyun = targetIndex 0
            Image 2 = Wendy   = targetIndex 1
            Image 3 = JB      = targetIndex 2
            Image 4 = Han     = targetIndex 3

        -->

        <a-entity

            id="taehyunTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- ===================================== -->
            <!-- TAEHYUN VIDEO -->
            <!-- ===================================== -->

            <a-video

                id="taehyunVideoPlane"

                src="#taehyunVideo"

                position="0 0 0.01"

                rotation="0 0 0"

                width="1"

                height="1.777"

            >
            </a-video>


        </a-entity>


    </a-scene>


    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                // =====================================
                // GET HTML ELEMENTS
                // =====================================

                const sceneEl =
                    document.querySelector("#arScene");


                const startButton =
                    document.querySelector("#startButton");


                const status =
                    document.querySelector("#status");


                const taehyunTarget =
                    document.querySelector("#taehyunTarget");


                const taehyunVideo =
                    document.querySelector("#taehyunVideo");


                // =====================================
                // MINDAR SYSTEM
                // =====================================

                let arSystem = null;


                // =====================================
                // WAIT FOR A-FRAME SCENE TO LOAD
                // =====================================

                sceneEl.addEventListener(
                    "loaded",
                    function () {

                        console.log(
                            "A-Frame scene loaded."
                        );


                        // Get MindAR system
                        arSystem =
                            sceneEl.systems[
                                "mindar-image-system"
                            ];


                        // Check if MindAR loaded
                        if (!arSystem) {

                            console.error(
                                "MindAR system was NOT found."
                            );


                            status.innerText =
                                "❌ MindAR system was NOT loaded.";

                            return;

                        }


                        console.log(
                            "MindAR system loaded successfully."
                        );


                        status.innerText =
                            "✅ MindAR loaded. Ready!";


                        // Enable button
                        startButton.disabled =
                            false;


                        startButton.textContent =
                            "START AR";

                    }
                );


                // =====================================
                // START AR
                // =====================================

                startButton.addEventListener(
                    "click",
                    function () {

                        console.log(
                            "START AR clicked."
                        );


                        // Safety check
                        if (!arSystem) {

                            status.innerText =
                                "❌ MindAR is not ready yet.";

                            console.error(
                                "MindAR system is unavailable."
                            );

                            return;

                        }


                        // Disable button
                        startButton.disabled =
                            true;


                        // Hide button
                        startButton.style.display =
                            "none";


                        // Update status
                        status.innerText =
                            "📷 Starting camera...";


                        console.log(
                            "Starting MindAR..."
                        );


                        try {

                            arSystem.start();

                        }

                        catch (error) {

                            console.error(
                                "MindAR start error:",
                                error
                            );


                            startButton.style.display =
                                "block";


                            startButton.disabled =
                                false;


                            startButton.textContent =
                                "START AR";


                            status.innerText =
                                "❌ AR start error.";

                        }

                    }
                );


                // =====================================
                // AR READY
                // =====================================

                sceneEl.addEventListener(
                    "arReady",
                    function () {

                        console.log(
                            "MINDAR IS READY!"
                        );


                        status.innerText =
                            "✅ Camera ready! Point at TaeHyun's card.";

                    }
                );


                // =====================================
                // AR ERROR
                // =====================================

                sceneEl.addEventListener(
                    "arError",
                    function (event) {

                        console.error(
                            "MINDAR AR ERROR:",
                            event
                        );


                        startButton.style.display =
                            "block";


                        startButton.disabled =
                            false;


                        startButton.textContent =
                            "START AR";


                        status.innerText =
                            "❌ MindAR could not start.";

                    }
                );


                // =====================================
                // TAEHYUN CARD FOUND
                // =====================================

                taehyunTarget.addEventListener(
                    "targetFound",
                    function () {

                        console.log(
                            "🎬 TAEHYUN CARD FOUND!"
                        );


                        status.innerText =
                            "🎬 TaeHyun found!";


                        // Start video from beginning
                        taehyunVideo.currentTime =
                            0;


                        // Play AI animation
                        taehyunVideo
                            .play()
                            .then(
                                function () {

                                    console.log(
                                        "✅ TaeHyun video is playing!"
                                    );

                                }
                            )
                            .catch(
                                function (error) {

                                    console.error(
                                        "❌ Video playback error:",
                                        error
                                    );

                                }
                            );

                    }
                );


                // =====================================
                // TAEHYUN CARD LOST
                // =====================================

                taehyunTarget.addEventListener(
                    "targetLost",
                    function () {

                        console.log(
                            "TAEHYUN CARD LOST."
                        );


                        status.innerText =
                            "🔍 Looking for TaeHyun card...";


                        // Pause video
                        taehyunVideo.pause();

                    }
                );


            }
        );

    </script>


</body>

</html>
