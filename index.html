<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Lake - AR Character Archive</title>


    <!-- ========================================= -->
    <!-- A-FRAME -->
    <!-- ========================================= -->

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>


    <!-- ========================================= -->
    <!-- MINDAR IMAGE TRACKING -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- ========================================= -->
    <!-- STYLE -->
    <!-- ========================================= -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: black;
        }


        #startButton {

            position: fixed;

            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 30px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #111;
            color: white;

        }


        #status {

            position: fixed;

            z-index: 9999;

            left: 10px;
            right: 10px;
            bottom: 10px;

            padding: 10px;

            background: rgba(0,0,0,0.75);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            border-radius: 8px;

            text-align: center;

        }

    </style>

</head>


<body>


    <!-- ========================================= -->
    <!-- START AR BUTTON -->
    <!-- ========================================= -->

    <button id="startButton">
        START AR
    </button>


    <!-- ========================================= -->
    <!-- DEBUG STATUS -->
    <!-- ========================================= -->

    <div id="status">
        Loading AR system...
    </div>


    <!-- ========================================= -->
    <!-- AR SCENE -->
    <!-- ========================================= -->

    <a-scene

        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        color-space="sRGB"

        renderer="
            colorManagement: true;
            physicallyCorrectLights
        "

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >


        <!-- ========================================= -->
        <!-- ASSETS -->
        <!-- ========================================= -->

        <a-assets>

            <video

                id="taehyunVideo"

                src="./videos/TaeHyun.mp4"

                preload="auto"

                loop

                playsinline

                webkit-playsinline

                muted

            >
            </video>

        </a-assets>


        <!-- ========================================= -->
        <!-- CAMERA -->
        <!-- ========================================= -->

        <a-camera

            position="0 0 0"

            look-controls="enabled: false"

        >
        </a-camera>


        <!-- ========================================= -->
        <!-- TAEHYUN TARGET -->
        <!-- ========================================= -->

        <!--

            MindAR target order:

            0 = TaeHyun
            1 = Wendy
            2 = JB
            3 = Han

        -->

        <a-entity

            id="taehyunTarget"

            mindar-image-target="targetIndex: 0"

        >


            <!-- ================================= -->
            <!-- VIDEO -->
            <!-- ================================= -->

            <a-video

                id="taehyunVideoPlane"

                src="#taehyunVideo"

                position="0 0 0.01"

                width="1"

                height="1.777"

            >
            </a-video>


        </a-entity>


    </a-scene>


    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                // ---------------------------------
                // GET ELEMENTS
                // ---------------------------------

                const sceneEl =
                    document.querySelector("a-scene");


                const startButton =
                    document.querySelector("#startButton");


                const status =
                    document.querySelector("#status");


                const taehyunTarget =
                    document.querySelector("#taehyunTarget");


                const taehyunVideo =
                    document.querySelector("#taehyunVideo");


                // ---------------------------------
                // CHECK MINDAR SYSTEM
                // ---------------------------------

                const arSystem =
                    sceneEl.systems["mindar-image-system"];


                console.log(
                    "MindAR system:",
                    arSystem
                );


                if (!arSystem) {

                    status.innerText =
                        "❌ MindAR system was NOT loaded.";

                    console.error(
                        "MindAR system was not found."
                    );

                    return;
                }


                status.innerText =
                    "✅ MindAR loaded. Ready!";


                // ---------------------------------
                // START BUTTON
                // ---------------------------------

                startButton.addEventListener(
                    "click",
                    function () {


                        console.log(
                            "START AR clicked."
                        );


                        status.innerText =
                            "📷 Starting camera...";


                        startButton.style.display =
                            "none";


                        try {

                            arSystem.start();

                        }

                        catch (error) {

                            console.error(
                                "MindAR start error:",
                                error
                            );


                            status.innerText =
                                "❌ AR start error: " +
                                error.message;


                            startButton.style.display =
                                "block";

                        }

                    }
                );


                // ---------------------------------
                // AR READY
                // ---------------------------------

                sceneEl.addEventListener(
                    "arReady",
                    function () {

                        console.log(
                            "AR READY!"
                        );


                        status.innerText =
                            "✅ Camera ready. Point at TaeHyun's card!";

                    }
                );


                // ---------------------------------
                // AR ERROR
                // ---------------------------------

                sceneEl.addEventListener(
                    "arError",
                    function (event) {

                        console.error(
                            "AR ERROR:",
                            event
                        );


                        status.innerText =
                            "❌ MindAR reported an AR error.";

                        startButton.style.display =
                            "block";

                    }
                );


                // ---------------------------------
                // TAEHYUN FOUND
                // ---------------------------------

                taehyunTarget.addEventListener(
                    "targetFound",
                    function () {

                        console.log(
                            "TAEHYUN FOUND!"
                        );


                        status.innerText =
                            "🎬 TaeHyun found!";


                        taehyunVideo.currentTime =
                            0;


                        taehyunVideo
                            .play()
                            .then(
                                function () {

                                    console.log(
                                        "TaeHyun video playing!"
                                    );

                                }
                            )
                            .catch(
                                function (error) {

                                    console.error(
                                        "Video error:",
                                        error
                                    );

                                }
                            );

                    }
                );


                // ---------------------------------
                // TAEHYUN LOST
                // ---------------------------------

                taehyunTarget.addEventListener(
                    "targetLost",
                    function () {

                        console.log(
                            "TAEHYUN LOST"
                        );


                        status.innerText =
                            "🔍 Looking for TaeHyun card...";


                        taehyunVideo.pause();

                    }
                );


            }
        );

    </script>


</body>

</html>
