<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Lake - AR Character Archive</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #startButton {
            position: fixed;
            z-index: 9999;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            padding: 18px 32px;

            font-size: 20px;
            font-weight: bold;

            border: none;
            border-radius: 12px;

            background: #111;
            color: white;

            cursor: pointer;
        }

        #startButton:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #status {
            position: fixed;
            z-index: 9999;

            left: 10px;
            right: 10px;
            bottom: 10px;

            padding: 12px;

            background: rgba(0, 0, 0, 0.8);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 14px;

            border-radius: 8px;

            text-align: center;
        }

        #debug {
            position: fixed;
            z-index: 9998;

            top: 10px;
            left: 10px;
            right: 10px;

            max-height: 220px;

            overflow-y: auto;

            padding: 10px;

            background: rgba(0, 0, 0, 0.8);
            color: #00ff88;

            font-family: monospace;
            font-size: 12px;

            border-radius: 8px;
        }

        /*
            Keep videos available to the browser,
            but invisible to the user.
        */

        .arVideo {
            position: fixed;

            width: 1px;
            height: 1px;

            left: -10px;
            top: -10px;

            opacity: 0;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- ==========================================
         START BUTTON
         ========================================== -->

    <button id="startButton" disabled>
        LOADING...
    </button>


    <!-- ==========================================
         STATUS
         ========================================== -->

    <div id="status">
        Loading AR scene...
    </div>


    <!-- ==========================================
         DEBUG
         ========================================== -->

    <div id="debug">
        Starting...
    </div>


    <!-- ==========================================
         AR SCENE
         ========================================== -->

    <a-scene
        id="arScene"

        mindar-image="
            imageTargetSrc: ./targets.mind;
            autoStart: false;
            uiLoading: no;
            uiError: no;
            uiScanning: no;
        "

        embedded

        vr-mode-ui="enabled: false"

        device-orientation-permission-ui="enabled: false"
    >

        <!-- ======================================
             VIDEO ASSETS
             ====================================== -->

        <a-assets>

            <!-- TaeHyun -->
            <video
                id="taehyunVideo"
                class="arVideo"
                src="./videos/Taehyun.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                muted
                crossorigin="anonymous"
            ></video>


            <!-- Wendy -->
            <video
                id="wendyVideo"
                class="arVideo"
                src="./videos/Wendy.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                muted
                crossorigin="anonymous"
            ></video>


            <!-- JB -->
            <video
                id="jbVideo"
                class="arVideo"
                src="./videos/JB.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                muted
                crossorigin="anonymous"
            ></video>


            <!-- Han -->
            <video
                id="hanVideo"
                class="arVideo"
                src="./videos/Han.mp4"
                preload="auto"
                loop
                playsinline
                webkit-playsinline
                muted
                crossorigin="anonymous"
            ></video>

        </a-assets>


        <!-- ======================================
             CAMERA
             ====================================== -->

        <a-camera
            position="0 0 0"
            look-controls="enabled: false"
        ></a-camera>


        <!-- ======================================
             TAEHYUN
             TARGET 0
             ====================================== -->

        <a-entity
            id="taehyunTarget"
            mindar-image-target="targetIndex: 0;"
        >

            <a-video
                id="taehyunPlane"
                src="#taehyunVideo"
                position="0 0 0.01"
                width="1.733333"
                height="1"
            ></a-video>

        </a-entity>


        <!-- ======================================
             WENDY
             TARGET 1
             ====================================== -->

        <a-entity
            id="wendyTarget"
            mindar-image-target="targetIndex: 1;"
        >

            <a-video
                id="wendyPlane"
                src="#wendyVideo"
                position="0 0 0.01"
                width="1"
                height="1"
            ></a-video>

        </a-entity>


        <!-- ======================================
             JB
             TARGET 2
             ====================================== -->

        <a-entity
            id="jbTarget"
            mindar-image-target="targetIndex: 2;"
        >

            <a-video
                id="jbPlane"
                src="#jbVideo"
                position="0 0 0.01"
                width="1"
                height="1"
            ></a-video>

        </a-entity>


        <!-- ======================================
             HAN
             TARGET 3
             ====================================== -->

        <a-entity
            id="hanTarget"
            mindar-image-target="targetIndex: 3;"
        >

            <a-video
                id="hanPlane"
                src="#hanVideo"
                position="0 0 0.01"
                width="1"
                height="1"
            ></a-video>

        </a-entity>

    </a-scene>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script>

        /*
            ======================================
            BASIC ELEMENTS
            ======================================
        */

        const scene =
            document.querySelector("#arScene");

        const startButton =
            document.querySelector("#startButton");

        const status =
            document.querySelector("#status");

        const debug =
            document.querySelector("#debug");


        /*
            ======================================
            CHARACTER CONFIGURATION
            ======================================

            targetIndex:
            0 = TaeHyun
            1 = Wendy
            2 = JB
            3 = Han
        */

        const characters = [

            {
                name: "TaeHyun",
                target: document.querySelector("#taehyunTarget"),
                video: document.querySelector("#taehyunVideo"),
                plane: document.querySelector("#taehyunPlane")
            },

            {
                name: "Wendy",
                target: document.querySelector("#wendyTarget"),
                video: document.querySelector("#wendyVideo"),
                plane: document.querySelector("#wendyPlane")
            },

            {
                name: "JB",
                target: document.querySelector("#jbTarget"),
                video: document.querySelector("#jbVideo"),
                plane: document.querySelector("#jbPlane")
            },

            {
                name: "Han",
                target: document.querySelector("#hanTarget"),
                video: document.querySelector("#hanVideo"),
                plane: document.querySelector("#hanPlane")
            }

        ];


        /*
            ======================================
            DEBUG FUNCTION
            ======================================
        */

        function debugMessage(message) {

            console.log(message);

            debug.innerHTML +=
                "<br>" + message;

            debug.scrollTop =
                debug.scrollHeight;
        }


        /*
            ======================================
            VIDEO ERROR
            ======================================
        */

        function getVideoErrorMessage(video) {

            if (!video.error) {
                return "No browser video error information.";
            }

            switch (video.error.code) {

                case 1:
                    return "MEDIA_ERR_ABORTED";

                case 2:
                    return "MEDIA_ERR_NETWORK";

                case 3:
                    return "MEDIA_ERR_DECODE";

                case 4:
                    return "MEDIA_ERR_SRC_NOT_SUPPORTED";

                default:
                    return "Unknown video error.";
            }
        }


        /*
            ======================================
            AUTOMATIC VIDEO ASPECT RATIO
            ======================================
        */

        characters.forEach(function(character) {

            const video = character.video;
            const plane = character.plane;

            video.addEventListener(
                "loadedmetadata",
                function() {

                    const videoWidth =
                        video.videoWidth;

                    const videoHeight =
                        video.videoHeight;


                    if (
                        videoWidth > 0 &&
                        videoHeight > 0
                    ) {

                        const aspectRatio =
                            videoWidth / videoHeight;


                        /*
                            Keep height at 1
                            and calculate width.
                        */

                        plane.setAttribute(
                            "width",
                            aspectRatio
                        );

                        plane.setAttribute(
                            "height",
                            1
                        );


                        debugMessage(
                            "📐 " +
                            character.name +
                            ": " +
                            videoWidth +
                            " × " +
                            videoHeight +
                            " | Ratio: " +
                            aspectRatio.toFixed(3)
                        );

                    }

                }
            );


            /*
                Video can play
            */

            video.addEventListener(
                "canplay",
                function() {

                    debugMessage(
                        "✅ " +
                        character.name +
                        " video ready."
                    );

                }
            );


            /*
                Video error
            */

            video.addEventListener(
                "error",
                function() {

                    debugMessage(
                        "❌ " +
                        character.name +
                        " VIDEO ERROR: " +
                        getVideoErrorMessage(video)
                    );

                }
            );

        });


        /*
            ======================================
            A-FRAME LOADED
            ======================================
        */

        scene.addEventListener(
            "loaded",
            function() {

                debugMessage(
                    "✅ A-Frame scene loaded."
                );

                status.innerText =
                    "A-Frame ready. Checking MindAR...";

                checkMindAR();

            }
        );


        /*
            ======================================
            CHECK MINDAR
            ======================================
        */

        function checkMindAR() {

            let attempts = 0;

            const timer =
                setInterval(
                    function() {

                        attempts++;

                        debugMessage(
                            "Checking MindAR system... " +
                            attempts
                        );

                        const arSystem =
                            scene.systems[
                                "mindar-image-system"
                            ];


                        if (arSystem) {

                            clearInterval(timer);

                            debugMessage(
                                "================================"
                            );

                            debugMessage(
                                "✅ MINDAR SYSTEM FOUND!"
                            );

                            debugMessage(
                                "================================"
                            );

                            status.innerText =
                                "✅ MindAR loaded. Ready!";

                            startButton.disabled =
                                false;

                            startButton.innerText =
                                "START AR";

                            setupAR(arSystem);

                        }


                        if (attempts >= 20) {

                            clearInterval(timer);

                            debugMessage(
                                "================================"
                            );

                            debugMessage(
                                "❌ MindAR system was NOT created."
                            );

                            debugMessage(
                                "================================"
                            );

                            status.innerText =
                                "❌ MindAR system failed.";

                        }

                    },
                    500
                );

        }


        /*
            ======================================
            SETUP AR
            ======================================
        */

        function setupAR(arSystem) {


            /*
                ==================================
                START AR BUTTON
                ==================================
            */

            startButton.addEventListener(
                "click",
                function() {

                    debugMessage(
                        "START AR clicked."
                    );

                    startButton.style.display =
                        "none";

                    status.innerText =
                        "📷 Starting webcam...";


                    /*
                        Prepare all videos.
                    */

                    characters.forEach(
                        function(character) {

                            const video =
                                character.video;

                            video.muted =
                                true;

                            video.defaultMuted =
                                true;

                            video.setAttribute(
                                "muted",
                                ""
                            );

                            video.setAttribute(
                                "playsinline",
                                ""
                            );

                            video.setAttribute(
                                "webkit-playsinline",
                                ""
                            );


                            try {

                                video.load();

                            } catch (error) {

                                debugMessage(
                                    "❌ " +
                                    character.name +
                                    " load error: " +
                                    error.message
                                );

                            }

                        }
                    );


                    /*
                        Start MindAR.
                    */

                    try {

                        arSystem.start();

                    } catch (error) {

                        console.error(error);

                        debugMessage(
                            "❌ Start error: " +
                            error.message
                        );

                        status.innerText =
                            "❌ AR failed to start.";

                        startButton.style.display =
                            "block";

                    }

                }
            );


            /*
                ==================================
                AR READY
                ==================================
            */

            scene.addEventListener(
                "arReady",
                function() {

                    debugMessage(
                        "✅ WEBCAM READY."
                    );

                    status.innerText =
                        "✅ Webcam ready! Point at a Character Card.";

                }
            );


            /*
                ==================================
                AR ERROR
                ==================================
            */

            scene.addEventListener(
                "arError",
                function(event) {

                    debugMessage(
                        "❌ MindAR camera error."
                    );

                    console.error(event);

                    status.innerText =
                        "❌ MindAR camera error.";

                    startButton.style.display =
                        "block";

                    startButton.disabled =
                        false;

                    startButton.innerText =
                        "START AR";

                }
            );


            /*
                ==================================
                TARGET EVENTS
                ==================================
            */

            characters.forEach(
                function(character) {


                    /*
                        CARD FOUND
                    */

                    character.target.addEventListener(
                        "targetFound",
                        function() {

                            debugMessage(
                                "🎬 " +
                                character.name +
                                " CARD FOUND!"
                            );

                            status.innerText =
                                "🎬 " +
                                character.name +
                                " found!";


                            /*
                                Pause other character
                                videos first.
                            */

                            characters.forEach(
                                function(other) {

                                    if (
                                        other !== character
                                    ) {

                                        other.video.pause();

                                    }

                                }
                            );


                            /*
                                Reset current video.
                            */

                            try {

                                character.video.currentTime =
                                    0;

                            } catch (error) {

                                debugMessage(
                                    "⚠️ Could not reset " +
                                    character.name +
                                    " video."
                                );

                            }


                            /*
                                Make sure playback
                                is allowed.
                            */

                            character.video.muted =
                                true;

                            character.video.playsInline =
                                true;


                            /*
                                Play character video.
                            */

                            const playPromise =
                                character.video.play();


                            if (
                                playPromise !== undefined
                            ) {

                                playPromise
                                    .then(
                                        function() {

                                            debugMessage(
                                                "✅ " +
                                                character.name +
                                                " VIDEO PLAYING!"
                                            );

                                            status.innerText =
                                                "🎬 " +
                                                character.name +
                                                " animation playing!";

                                        }
                                    )
                                    .catch(
                                        function(error) {

                                            debugMessage(
                                                "❌ " +
                                                character.name +
                                                " VIDEO PLAYBACK FAILED"
                                            );

                                            debugMessage(
                                                "Reason: " +
                                                error.message
                                            );

                                            debugMessage(
                                                "ReadyState: " +
                                                character.video.readyState
                                            );

                                            debugMessage(
                                                "Video error: " +
                                                getVideoErrorMessage(
                                                    character.video
                                                )
                                            );

                                            console.error(
                                                character.name +
                                                " video playback failed:",
                                                error
                                            );

                                            status.innerText =
                                                "❌ " +
                                                character.name +
                                                " video could not play.";

                                        }
                                    );

                            }

                        }
                    );


                    /*
                        CARD LOST
                    */

                    character.target.addEventListener(
                        "targetLost",
                        function() {

                            debugMessage(
                                character.name +
                                " card lost."
                            );

                            character.video.pause();

                            status.innerText =
                                "🔍 Looking for a Character Card...";

                        }
                    );

                }
            );

        }

    </script>

</body>
</html>
